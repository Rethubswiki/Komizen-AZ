name: Baseline Profile Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'baselineprofile/**'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run baseline profile generation
        run: ./gradlew :app:generateBaselineProfile

      - name: Upload baseline profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/main/baseline-prof.txt
