name: Baseline Profile Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'baselineprofile/**'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-latest
    # Solo ejecuta si es manual O si el PR tiene label 'benchmark'
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.3.2
        with:
          gradle-version: "8.7"

      - name: Verify gradle wrapper
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Run baseline profile generation
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:generateBaselineProfile
          else
            gradle :app:generateBaselineProfile
          fi

      - name: Upload baseline profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/main/baseline-prof.txt
