name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.3.2
        with:
          gradle-version: "8.7"

      # FIX 1: Verificar que gradlew existe antes de chmod
      - name: Verify gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "::warning::gradlew not found, will use system gradle"
          else
            chmod +x gradlew
          fi

      # FIX 2: Fallback a 'gradle' si falta wrapper jar
      - name: Run ktlint
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew ktlintCheck
          else
            gradle ktlintCheck
          fi

      - name: Run unit tests
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew testDebugUnitTest
          else
            gradle testDebugUnitTest
          fi

      - name: Build debug APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3.3.2
        with:
          gradle-version: "8.7"
      - run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
      - run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew lintDebug
          else
            gradle lintDebug
          fi
