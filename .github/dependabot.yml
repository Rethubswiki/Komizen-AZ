version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-coroutines:
        patterns:
          - "org.jetbrains.kotlinx:*"
      testing:
        patterns:
          - "junit:*"
          - "androidx.test.*"
          - "io.mockk:*"
    ignore:
      # Rompen compatibilidad con AGP 8.4 / Gradle 8.7 / Kotlin 1.9.24
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Alpha / inestables / breaking
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:logging-interceptor"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.retrofit2:retrofit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.insert-koin:koin-android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.insert-koin:koin-androidx-compose"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jlleitschuh.gradle.ktlint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.room:room-runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.room:room-ktx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.room:room-compiler"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    ignore:
      # v4 es la última estable para actions oficiales; v5+ no existe o es experimental
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-java"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle/actions/setup-gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
